{% extends "appbuilder/base.html" %}

{% block content %}


<div class="container my-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex align-items-center">
            <i class="fa fa-comments fa-2x mr-3"></i>
            <h3 class="mb-0">Asistente Virtual - Rutas y Sabores</h3>
        </div>
        <div class="card-body">
            <div id="chat-box" class="p-3 mb-3 border rounded" style="height: 400px; overflow-y: auto; background-color: #f8f9fa;">
                <div class="alert alert-info text-dark">
                    <strong>🤖 Asistente:</strong> ¡Hola! Soy tu asistente de <strong>Rutas y Sabores</strong>. ¿En qué puedo ayudarte?
                </div>
            </div>

            <form id="chat-form" class="d-flex">
                <input type="text" id="user-input" class="form-control mr-2" placeholder="Escribe tu consulta aquí..." required autocomplete="off">
                <button type="submit" class="btn btn-primary">
                    <i class="fa fa-paper-plane"></i> Enviar
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Librería para formatear Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
document.getElementById('chat-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const input = document.getElementById('user-input');
    const message = input.value.trim();
    if (!message) return;

    const chatBox = document.getElementById('chat-box');

    // Renderizar mensaje del usuario
    chatBox.innerHTML += `
        <div class="text-right mb-2">
            <span class="d-inline-block p-2 bg-primary text-white rounded text-left" style="max-width: 80%;">
                <strong>Tú:</strong> ${message}
            </span>
        </div>
    `;
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const response = await fetch('/asistente/api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mensaje: message })
        });
        const data = await response.json();
        
        const respuestaHtml = marked.parse(data.respuesta || 'Sin respuesta');
        chatBox.innerHTML += `
            <div class="text-left mb-2">
                <div class="alert alert-secondary d-inline-block p-2 text-dark" style="max-width: 80%;">
                    <strong>🤖 Asistente:</strong><br>${respuestaHtml}
                </div>
            </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
    } catch (err) {
        chatBox.innerHTML += `
            <div class="text-left mb-2">
                <div class="alert alert-danger d-inline-block p-2" style="max-width: 80%;">
                    <strong>Error:</strong> No se pudo conectar con el servidor.
                </div>
            </div>
        `;
    }
});
</script>
{% endblock %}
