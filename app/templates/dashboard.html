{% extends "appbuilder/base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">

<div class="container my-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="fa fa-comments mr-2"></i>Asistente de Repostería e Inteligencia Artificial</h3>
        </div>
        <div class="card-body">
            <div id="chat" class="p-3 mb-3 border rounded" style="height: 350px; overflow-y: auto; background-color: #f8f9fa;"></div>

            <form id="form" class="d-flex">
                <input type="text" id="mensaje" class="form-control mr-2" placeholder="Escriba algún mensaje" autocomplete="off" required>
                <button id="enviar" type="submit" class="btn btn-primary">
                    <i class="fa fa-paper-plane mr-1"></i> Enviar pregunta
                </button>
            </form>
        </div>
    </div>
</div>

<script>
const formulario = document.getElementById("form");
const input = document.getElementById("mensaje");
const chat = document.getElementById("chat");
const button = document.getElementById("enviar");

const historico = [];

function mostrarMensaje(autor, texto) {
    const mensaje = document.createElement("p");
    const titulo = document.createElement("strong");
    titulo.textContent = autor + ": ";
    mensaje.appendChild(titulo);
    mensaje.appendChild(document.createTextNode(texto));
    chat.appendChild(mensaje);
    chat.scrollTop = chat.scrollHeight;
    return mensaje;
}

formulario.addEventListener("submit", async (event) => {
    event.preventDefault();
    const mensaje = input.value.trim();
    if (!mensaje) return;

    const historialMensajes = [...historico];
    mostrarMensaje("Tú", mensaje);
    historico.push({
        role: "user",
        content: mensaje
    });

    input.value = "";
    button.disabled = true;
    const loading = mostrarMensaje("IA", "Esperando respuesta de la IA...");

    try {
        const response = await fetch("/api/asistente", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: mensaje,
                history: historialMensajes
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Error al consultar el servidor.");
        }

        const respuestaIA = data.respuesta;
        if (!respuestaIA) {
            throw new Error("El servidor no devolvió una respuesta válida.");
        }

        loading.remove();
        mostrarMensaje("IA", respuestaIA);

        historico.push({
            role: "assistant",
            content: respuestaIA
        });

    } catch (error) {
        loading.remove();
        mostrarMensaje("Error", error.message || "No se pudo conectar con el servidor.");
        console.error("Error del asistente:", error);
    } finally {
        button.disabled = false;
        input.focus();
    }
});
</script>
{% endblock %}
