{% extends "appbuilder/base.html" %}

{% block content %}
<div class="container my-4" style="max-width: 850px;">
    <div class="card shadow-lg border-0 rounded-lg">
        <!-- Encabezado del Chat -->
        <div class="card-header text-white d-flex align-items-center justify-content-between p-3" style="background-color: #18bc9c; border-top-left-radius: .5rem; border-top-right-radius: .5rem;">
            <div class="d-flex align-items-center">
                <div class="bg-white text-success rounded-circle d-flex align-items-center justify-content-center mr-3" style="width: 45px; height: 45px; font-size: 22px;">
                    🤖
                </div>
                <div>
                    <h4 class="mb-0 font-weight-bold" style="font-size: 1.2rem;">Asistente Virtual IA</h4>
                    <small class="text-white-50"><i class="fa fa-circle text-warning mr-1" style="font-size: 10px;"></i>Rutas y Sabores • En línea</small>
                </div>
            </div>
            <button class="btn btn-sm btn-outline-light" onclick="limpiarChat()"><i class="fa fa-refresh mr-1"></i> Nueva consulta</button>
        </div>

        <!-- Área de Conversación -->
        <div class="card-body p-4" style="background-color: #f4f6f7;">
            <div id="chat" class="d-flex flex-column" style="height: 430px; overflow-y: auto; padding-right: 8px;">
                <!-- Mensaje de bienvenida -->
                <div class="d-flex align-items-start mb-3">
                    <span class="badge badge-success p-2 mr-2" style="font-size: 14px; border-radius: 50%;">🤖</span>
                    <div class="bg-white p-3 shadow-sm text-dark" style="max-width: 80%; border-radius: 15px; border-top-left-radius: 0;">
                        ¡Hola! Soy tu asistente inteligente de <strong>Rutas y Sabores</strong>. ¿En qué te puedo ayudar hoy? (recetas, información sobre rutas, estado de reservas o logística).
                    </div>
                </div>
            </div>

            <!-- Formulario de Entrada -->
            <form id="form" class="mt-3">
                <div class="input-group">
                    <input type="text" id="mensaje" class="form-control form-control-lg border-0 shadow-sm" placeholder="Escribe tu consulta aquí..." autocomplete="off" required style="border-radius: 25px 0 0 25px; font-size: 15px;">
                    <div class="input-group-append">
                        <button id="enviar" type="submit" class="btn btn-success px-4 shadow-sm" style="border-radius: 0 25px 25px 0; background-color: #18bc9c; border: none;">
                            <i class="fa fa-paper-plane mr-1"></i> Enviar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Librería para procesar respuestas en formato Markdown (listas, negritas, código) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
const formulario = document.getElementById("form");
const input = document.getElementById("mensaje");
const chat = document.getElementById("chat");
const button = document.getElementById("enviar");

let historico = [];

function agregarBurbuja(autor, texto, esUsuario) {
    const contenedor = document.createElement("div");
    contenedor.className = `d-flex align-items-start mb-3 ${esUsuario ? 'justify-content-end' : ''}`;

    // Renderizar formato Markdown para las respuestas de la IA
    const contenidoFormateado = esUsuario ? texto : marked.parse(texto);

    const contenido = `
        ${!esUsuario ? '<span class="badge badge-success p-2 mr-2" style="font-size: 14px; border-radius: 50%;">🤖</span>' : ''}
        <div class="p-3 shadow-sm ${esUsuario ? 'bg-success text-white' : 'bg-white text-dark'}" 
             style="max-width: 80%; border-radius: 15px; ${esUsuario ? 'border-top-right-radius: 0; background-color: #18bc9c !important;' : 'border-top-left-radius: 0;'}">
            <strong style="font-size: 12px; opacity: 0.8;">${autor}</strong>
            <div class="mt-1">${contenidoFormateado}</div>
        </div>
        ${esUsuario ? '<span class="badge badge-secondary p-2 ml-2" style="font-size: 14px; border-radius: 50%;">👤</span>' : ''}
    `;

    contenedor.innerHTML = contenido;
    chat.appendChild(contenedor);
    chat.scrollTop = chat.scrollHeight;
    return contenedor;
}

function limpiarChat() {
    historico = [];
    chat.innerHTML = `
        <div class="d-flex align-items-start mb-3">
            <span class="badge badge-success p-2 mr-2" style="font-size: 14px; border-radius: 50%;">🤖</span>
            <div class="bg-white p-3 shadow-sm text-dark" style="max-width: 80%; border-radius: 15px; border-top-left-radius: 0;">
                ¡Conversación reiniciada! ¿En qué más te puedo ayudar?
            </div>
        </div>
    `;
}

formulario.addEventListener("submit", async (event) => {
    event.preventDefault();
    const mensaje = input.value.trim();
    if (!mensaje) return;

    const historialMensajes = [...historico];
    agregarBurbuja("Tú", mensaje, true);
    historico.push({ role: "user", content: mensaje });

    input.value = "";
    button.disabled = true;

    const cargandoElem = agregarBurbuja("IA", "<em>Pensando respuesta...</em>", false);

    try {
        const response = await fetch("/api/asistente", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: mensaje, history: historialMensajes })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "Error en el servidor.");

        cargandoElem.remove();
        agregarBurbuja("IA", data.respuesta, false);
        historico.push({ role: "assistant", content: data.respuesta });

    } catch (error) {
        cargandoElem.remove();
        agregarBurbuja("Error", error.message || "No se pudo conectar con el servidor.", false);
    } finally {
        button.disabled = false;
        input.focus();
    }
});
</script>
{% endblock %}
